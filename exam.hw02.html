<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중첩 반복문으로 구구단 만들기</title>
</head>
<body>
    <h1>구구단</h1>
    <script>
    for (i=2; i<=9; i++) {
        document.write('<h2>'+ i + '단' + '</h2>');
        for (j=1; j<=9; j++) {
            document.write(i + 'X' + j + '=' + i*j + '<br>' );
        }
        document.write('<hr>');
    }
</script>
</body>
</html>
