<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공학용 계산기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #calculator {
            width: 320px;
            margin: 30px auto;
        }

        #display {
            box-sizing: border-box;
            width: 100%;
            height: 48px;
            margin-bottom: 8px;
            padding: 8px;
            font-size: 20px;
            text-align: right;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        button {
            min-height: 42px;
            font-size: 16px;
        }

        .equals {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <main id="calculator">
        <h1>공학용 계산기</h1>
        <input id="display" type="text" readonly aria-label="계산기 화면">
        <div class="keys">
            <button type="button" data-value="sin(">sin</button>
            <button type="button" data-value="cos(">cos</button>
            <button type="button" data-value="tan(">tan</button>
            <button type="button" data-value="log(">log</button>
            <button type="button" data-value="ln(">ln</button>

            <button type="button" data-value="sqrt(">sqrt</button>
            <button type="button" data-value="^2">x²</button>
            <button type="button" data-value="^">xʸ</button>
            <button type="button" data-value="!">x!</button>
            <button type="button" data-value="(">(</button>

            <button type="button" data-value=")">)</button>
            <button type="button" data-value="π">π</button>
            <button type="button" data-value="e">e</button>
            <button type="button" data-value="/">÷</button>
            <button type="button" data-value="*">×</button>

            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button type="button" data-value="-">−</button>
            <button type="button" data-action="clear">AC</button>

            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" data-value="+">+</button>
            <button type="button" data-action="backspace">←</button>

            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" data-value="0">0</button>
            <button type="button" data-value=".">.</button>

            <button type="button" class="equals" data-action="calculate">=</button>
        </div>
    </main>

    <script>
        const display = document.querySelector('#display');
        const keys = document.querySelector('.keys');

        function factorial(value) {
            if (!Number.isInteger(value) || value < 0 || value > 170) {
                throw new Error('팩토리얼은 0 이상의 정수만 계산할 수 있습니다.');
            }

            let result = 1;
            for (let i = 2; i <= value; i += 1) {
                result *= i;
            }
            return result;
        }

        function calculate(expression) {
            const tokens = expression
                .replaceAll('π', 'pi')
                .match(/(?:sin|cos|tan|log|ln|sqrt|pi|e)|\d*\.?\d+|[()+\-*/^!]/g);

            if (!tokens || tokens.join('') !== expression.replaceAll('π', 'pi')) {
                throw new Error('올바르지 않은 수식입니다.');
            }

            let position = 0;
            const peek = () => tokens[position];
            const consume = (token) => {
                if (token && peek() !== token) {
                    throw new Error('괄호 또는 연산자를 확인해 주세요.');
                }
                return tokens[position++];
            };

            function primary() {
                if (peek() === '(') {
                    consume('(');
                    const value = addSub();
                    consume(')');
                    return value;
                }

                if (['sin', 'cos', 'tan', 'log', 'ln', 'sqrt'].includes(peek())) {
                    const name = consume();
                    consume('(');
                    const value = addSub();
                    consume(')');

                    if (name === 'sqrt' && value < 0) {
                        throw new Error('음수의 제곱근은 계산할 수 없습니다.');
                    }
                    if (name === 'log' && value <= 0 || name === 'ln' && value <= 0) {
                        throw new Error('로그의 입력값은 0보다 커야 합니다.');
                    }

                    switch (name) {
                        case 'sin': return Math.sin(value);
                        case 'cos': return Math.cos(value);
                        case 'tan': return Math.tan(value);
                        case 'log': return Math.log10(value);
                        case 'ln': return Math.log(value);
                        case 'sqrt': return Math.sqrt(value);
                        default: throw new Error('지원하지 않는 함수입니다.');
                    }
                }

                if (peek() === 'pi' || peek() === 'e') {
                    return peek() === 'pi' ? (consume(), Math.PI) : (consume(), Math.E);
                }

                const number = Number(consume());
                if (!Number.isFinite(number)) {
                    throw new Error('숫자를 입력해 주세요.');
                }
                return number;
            }

            function factorials() {
                let value = primary();
                while (peek() === '!') {
                    consume('!');
                    value = factorial(value);
                }
                return value;
            }

            function unary() {
                if (peek() === '+') {
                    consume('+');
                    return unary();
                }
                if (peek() === '-') {
                    consume('-');
                    return -unary();
                }
                return factorials();
            }

            function power() {
                const value = unary();
                if (peek() === '^') {
                    consume('^');
                    return Math.pow(value, power());
                }
                return value;
            }

            function multiplyDivide() {
                let value = power();
                while (peek() === '*' || peek() === '/') {
                    const operator = consume();
                    const next = power();
                    if (operator === '*') {
                        value *= next;
                    } else {
                        if (next === 0) {
                            throw new Error('0으로 나눌 수 없습니다.');
                        }
                        value /= next;
                    }
                }
                return value;
            }

            function addSub() {
                let value = multiplyDivide();
                while (peek() === '+' || peek() === '-') {
                    const operator = consume();
                    const next = multiplyDivide();
                    value = operator === '+' ? value + next : value - next;
                }
                return value;
            }

            const result = addSub();
            if (position !== tokens.length || !Number.isFinite(result)) {
                throw new Error('완성되지 않은 수식입니다.');
            }
            return result;
        }

        keys.addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button) return;

            const value = button.dataset.value;
            const action = button.dataset.action;

            if (value) {
                display.value += value;
                return;
            }

            if (action === 'clear') {
                display.value = '';
            } else if (action === 'backspace') {
                display.value = display.value.slice(0, -1);
            } else if (action === 'calculate') {
                try {
                    display.value = String(calculate(display.value));
                } catch (error) {
                    display.value = error.message;
                }
            }
        });
    </script>
</body>
</html>
